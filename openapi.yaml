openapi: 3.0.0
info:
  title: Ride Sharing API
  version: 1.0.0
  description: |
    API documentation for the ride sharing platform

    ## Categories:
    - 🧑 **Rides - Passenger**: APIs for passengers (request ride, view my rides)
    - 🚗 **Rides - Driver**: APIs for drivers (nearby rides, accept ride, update status)
    - 💰 **Rides - Negotiation**: Price negotiation APIs (shared)
    - 📋 **Rides - Shared**: Shared APIs between passenger and driver

servers:
  - url: http://localhost:3000
    description: Local development server
  - url: https://your-production-url.com
    description: Production server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        phone:
          type: string
          nullable: true
          example: "+966501234567"
        email:
          type: string
          nullable: true
          format: email
          example: "user@example.com"
        name:
          type: string
          nullable: true
          example: "Ahmed Mohammed"
        avatarUrl:
          type: string
          nullable: true
          example: "https://example.com/avatar.jpg"
        role:
          type: string
          enum: [CLIENT, DRIVER, ADMIN, CUSTOMER_SUPPORT]
          example: "CLIENT"
        isVerified:
          type: boolean
          example: true
          description: Whether the user is verified
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Driver:
      type: object
      properties:
        id:
          type: integer
          example: 1
        userId:
          type: integer
          example: 5
        licenseNumber:
          type: string
          example: "123456789"
        carModel:
          type: string
          example: "Toyota Camry 2022"
        carPlate:
          type: string
          example: "ABC-1234"
        carColor:
          type: string
          nullable: true
          example: "White"
        carYear:
          type: integer
          nullable: true
          example: 2022
        isApproved:
          type: boolean
          example: true
          description: Whether the driver is approved by admin
        isOnline:
          type: boolean
          example: false
          description: Whether the driver is currently online
        latitude:
          type: number
          nullable: true
          example: 24.7136
          description: Current location - latitude
        longitude:
          type: number
          nullable: true
          example: 46.6753
          description: Current location - longitude
        lastLocationUpdate:
          type: string
          format: date-time
          nullable: true
          example: "2026-05-03T14:12:53.000Z"
          description: Last location update timestamp
        rating:
          type: number
          example: 4.5
          description: Overall rating
        totalRides:
          type: integer
          example: 150
          description: Number of completed rides
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Ride:
      type: object
      properties:
        id:
          type: integer
          example: 1
        clientId:
          type: integer
          example: 10
        driverId:
          type: integer
          nullable: true
          example: 5
        status:
          type: string
          enum: [REQUESTED, ACCEPTED, DRIVER_ARRIVED, IN_PROGRESS, COMPLETED, CANCELLED]
          example: "REQUESTED"
        type:
          type: string
          enum: [STANDARD, CARPOOLING]
          example: "STANDARD"
          description: |
            Ride type:
            - STANDARD: Standard 1-1 ride
            - CARPOOLING: Ride sharing
        maxPassengers:
          type: integer
          example: 1
          description: Maximum passengers (1 for standard, 2-4 for carpooling)
        availableSeats:
          type: integer
          example: 1
          description: Available seats
        systemFare:
          type: number
          nullable: true
          example: 35.50
          description: System calculated fare
        pickupLat:
          type: number
          example: 24.7136
        pickupLng:
          type: number
          example: 46.6753
        pickupAddress:
          type: string
          nullable: true
          example: "King Fahd Road, Riyadh"
        dropoffLat:
          type: number
          example: 24.7736
        dropoffLng:
          type: number
          example: 46.7353
        dropoffAddress:
          type: string
          nullable: true
          example: "King Khalid International Airport"
        fare:
          type: number
          nullable: true
          example: 30.00
          description: Final fare (after negotiation if any)
        distance:
          type: number
          nullable: true
          example: 15.5
          description: Distance in kilometers
        duration:
          type: integer
          nullable: true
          example: 1200
          description: Duration in seconds
        requestedAt:
          type: string
          format: date-time
        acceptedAt:
          type: string
          format: date-time
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        cancelReason:
          type: string
          nullable: true
          example: "Emergency situation"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Negotiation:
      type: object
      properties:
        id:
          type: integer
          example: 1
        rideId:
          type: integer
          example: 10
        systemFare:
          type: number
          example: 35.50
          description: Original system calculated fare
        clientOffer:
          type: number
          example: 30.00
          description: Client's offer
        driverCounter:
          type: number
          nullable: true
          example: 32.50
          description: Driver's counter offer (optional)
        agreedFare:
          type: number
          nullable: true
          example: 32.50
          description: Final agreed fare
        status:
          type: string
          enum: [PENDING, COUNTERED, ACCEPTED, REJECTED, EXPIRED]
          example: "PENDING"
          description: |
            Negotiation status:
            - PENDING: Client sent offer, no response yet
            - COUNTERED: Driver responded with counter offer
            - ACCEPTED: Agreement reached
            - REJECTED: Negotiation rejected
            - EXPIRED: Deadline passed
        expiresAt:
          type: string
          format: date-time
          description: Response deadline (e.g., 2 minutes)
        history:
          type: array
          description: History of all offers in this negotiation
          items:
            $ref: "#/components/schemas/NegotiationOffer"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Payment:
      type: object
      properties:
        id:
          type: integer
          example: 1
        rideId:
          type: integer
          example: 10
        amount:
          type: number
          example: 32.50
        method:
          type: string
          enum: [CASH, CARD, WALLET]
          example: "CASH"
        status:
          type: string
          enum: [PENDING, PAID, FAILED, REFUNDED]
          example: "PENDING"
        transactionId:
          type: string
          nullable: true
          example: "txn_123456789"
        passengerId:
          type: integer
          nullable: true
          description: For carpooling - payment by specific passenger (optional)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Review:
      type: object
      properties:
        id:
          type: integer
          example: 1
        rideId:
          type: integer
          example: 10
        clientId:
          type: integer
          example: 15
        driverId:
          type: integer
          example: 5
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comment:
          type: string
          nullable: true
          example: "Excellent driver and clean car"
        createdAt:
          type: string
          format: date-time

    RidePassenger:
      type: object
      properties:
        id:
          type: integer
          example: 1
        rideId:
          type: integer
          example: 10
        clientId:
          type: integer
          example: 15
        pickupLat:
          type: number
          example: 24.7136
        pickupLng:
          type: number
          example: 46.6753
        pickupAddress:
          type: string
          nullable: true
          example: "King Fahd Road, Riyadh"
        dropoffLat:
          type: number
          example: 24.7736
        dropoffLng:
          type: number
          example: 46.7353
        dropoffAddress:
          type: string
          nullable: true
          example: "King Khalid International Airport"
        fare:
          type: number
          nullable: true
          example: 15.00
          description: Passenger's share of the fare
        joinedAt:
          type: string
          format: date-time
        paymentId:
          type: integer
          nullable: true

    NegotiationOffer:
      type: object
      properties:
        id:
          type: integer
          example: 1
        negotiationId:
          type: integer
          example: 1
        offeredBy:
          type: string
          enum: [CLIENT, DRIVER]
          example: "CLIENT"
          description: Who made this offer
        amount:
          type: number
          example: 30.00
          description: Offered price
        message:
          type: string
          nullable: true
          example: "Can we lower the price a bit?"
          description: Optional message with the offer
        createdAt:
          type: string
          format: date-time

    SupportTicket:
      type: object
      properties:
        id:
          type: integer
          example: 1
        userId:
          type: integer
          example: 10
        subject:
          type: string
          example: "Issue with payment"
        message:
          type: string
          example: "I was charged twice for the same ride"
        isResolved:
          type: boolean
          example: false
          description: Whether the ticket has been resolved
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

paths:
  # ==================== Authentication ====================
  /api/auth/send-otp:
    post:
      tags:
        - Authentication
      summary: Send OTP to email
      description: |
        Send OTP verification code via email using Resend service
        - For new users (client): Account is created automatically upon verification
        - For drivers: Account must exist and be approved by admin beforehand
        - Rate Limiting: 3 attempts every 10 minutes
        - OTP validity: 5 minutes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - appContext
              properties:
                email:
                  type: string
                  format: email
                  example: "user@example.com"
                  description: User's email address
                appContext:
                  type: string
                  enum: [client, driver]
                  example: "client"
                  description: |
                    User type:
                    - client: Regular user (account created automatically)
                    - driver: Driver (must exist and be approved)
      responses:
        "200":
          description: OTP sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  expiresInSeconds:
                    type: integer
                    example: 300
                    description: OTP validity duration in seconds
        "400":
          description: Invalid email or context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Driver account pending approval
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Driver account pending approval"
        "404":
          description: No driver account found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "No driver account found"
        "429":
          description: Too many requests (rate limited)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Too many requests"
                  retryAfterSeconds:
                    type: integer
                    example: 600
                    description: Seconds before retry is allowed

  /api/auth/verify-otp:
    post:
      tags:
        - Authentication
      summary: Verify OTP and get JWT
      description: |
        Verify OTP code and get JWT token
        - For new users (client): Account is created automatically
        - For drivers: Account must exist
        - JWT valid for 7 days
        - Token returned in response and Cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - code
                - appContext
              properties:
                email:
                  type: string
                  format: email
                  example: "user@example.com"
                  description: Email address
                code:
                  type: string
                  example: "123456"
                  description: 6-digit verification code
                appContext:
                  type: string
                  enum: [client, driver]
                  example: "client"
                  description: User type
      responses:
        "200":
          description: Verification successful
          headers:
            Set-Cookie:
              description: JWT token in HttpOnly cookie
              schema:
                type: string
                example: "token=eyJhbGc...; HttpOnly; Path=/; Max-Age=604800; SameSite=Strict"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  token:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                    description: JWT token valid for 7 days
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      email:
                        type: string
                        example: "user@example.com"
                      role:
                        type: string
                        enum: [CLIENT, DRIVER, ADMIN, CUSTOMER_SUPPORT]
                        example: "CLIENT"
                      isVerified:
                        type: boolean
                        example: true
        "400":
          description: Invalid or expired OTP
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid or expired OTP"
        "403":
          description: Account type mismatch
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "This account is not a driver account."

  /api/auth/admin-login:
    post:
      tags:
        - Authentication
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  example: "admin@example.com"
                password:
                  type: string
                  example: "password123"
      responses:
        "200":
          description: Login successful

  # ==================== Profile ====================
  /api/profile:
    get:
      tags:
        - Profile
      summary: Get current user profile
      description: |
        Fetches current user profile
        - For drivers: includes driver information (car details, rating, etc.)
        - For clients: returns basic user information
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/User"
                  - type: object
                    properties:
                      driver:
                        nullable: true
                        description: Driver information (only for users with role=DRIVER)
                        allOf:
                          - $ref: "#/components/schemas/Driver"

    patch:
      tags:
        - Profile
      summary: Update user profile
      description: |
        Update user profile information
        - Can update basic user info (name, email, avatarUrl)
        - For drivers: can also update driver info (car details, online status)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Ahmed Mohammed"
                email:
                  type: string
                  format: email
                  example: "user@example.com"
                avatarUrl:
                  type: string
                  example: "https://example.com/avatar.jpg"
                driverInfo:
                  type: object
                  description: Driver-specific information (only for drivers)
                  properties:
                    licenseNumber:
                      type: string
                    carModel:
                      type: string
                    carPlate:
                      type: string
                    carColor:
                      type: string
                    carYear:
                      type: integer
                    isOnline:
                      type: boolean
                      description: Update online status
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                  driver:
                    nullable: true
                    description: Updated driver info (only for drivers)
                    allOf:
                      - $ref: "#/components/schemas/Driver"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Email already in use"

  # ==================== Drivers ====================
  /api/drivers/location:
    put:
      tags:
        - Drivers
      summary: 🚗 Update driver location
      description: |
        Driver updates their current location
        - Used when opening the app or pressing "Update Location" button
        - Saves last update timestamp (lastLocationUpdate)
        - Required for drivers only (role=DRIVER)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - latitude
                - longitude
              properties:
                latitude:
                  type: number
                  minimum: -90
                  maximum: 90
                  example: 24.7136
                  description: Latitude
                longitude:
                  type: number
                  minimum: -180
                  maximum: 180
                  example: 46.6753
                  description: Longitude
      responses:
        "200":
          description: Location updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      latitude:
                        type: number
                        example: 24.7136
                      longitude:
                        type: number
                        example: 46.6753
                      lastLocationUpdate:
                        type: string
                        format: date-time
                        example: "2026-05-03T14:12:53.000Z"
        "400":
          description: Invalid coordinates
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid latitude or longitude"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Missing or invalid authorization header"
        "403":
          description: Forbidden - Not a driver
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Unauthorized - Driver access only"

  # ==================== Rides - Passenger APIs ====================
  /api/rides:
    get:
      tags:
        - Rides - Passenger
      summary: 🧑 Get passenger rides
      description: |
        Fetches rides for current user as passenger (rides they requested)
        - Used by passenger to view their rides
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [PENDING, ACCEPTED, IN_PROGRESS, COMPLETED, CANCELLED]
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of rides
          content:
            application/json:
              schema:
                type: object
                properties:
                  rides:
                    type: array
                    items:
                      $ref: "#/components/schemas/Ride"
                  total:
                    type: integer

    post:
      tags:
        - Rides - Passenger
      summary: 🧑 Create new ride (request ride)
      description: |
        Passenger creates a new ride request
        - Specifies pickup and dropoff points
        - Chooses ride type (STANDARD or CARPOOLING)
        - System calculates fare automatically (systemFare)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pickupLat
                - pickupLng
                - dropoffLat
                - dropoffLng
              properties:
                pickupLat:
                  type: number
                  example: 24.7136
                  description: Pickup point latitude
                pickupLng:
                  type: number
                  example: 46.6753
                  description: Pickup point longitude
                pickupAddress:
                  type: string
                  example: "King Fahd Road, Riyadh"
                dropoffLat:
                  type: number
                  example: 24.7736
                  description: Dropoff point latitude
                dropoffLng:
                  type: number
                  example: 46.7353
                  description: Dropoff point longitude
                dropoffAddress:
                  type: string
                  example: "King Khalid International Airport"
                type:
                  type: string
                  enum: [STANDARD, CARPOOLING]
                  default: STANDARD
                  description: Ride type
                maxPassengers:
                  type: integer
                  minimum: 1
                  maximum: 4
                  default: 1
                  description: Maximum passengers (for CARPOOLING only)
      responses:
        "201":
          description: Ride created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ride"

  # ==================== Rides - Driver APIs ====================
  /api/rides/nearby:
    get:
      tags:
        - Rides - Driver
      summary: 🚗 Nearby available rides (for driver)
      description: |
        Driver views nearby rides available for acceptance
        - Shows only rides with PENDING status
        - Calculates distance from driver's current location
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: lat
          required: true
          schema:
            type: number
          description: Driver's current location - latitude
          example: 24.7136
        - in: query
          name: lng
          required: true
          schema:
            type: number
          description: Driver's current location - longitude
          example: 46.6753
        - in: query
          name: radius
          schema:
            type: number
            default: 10
          description: Search radius in kilometers
      responses:
        "200":
          description: Nearby available rides
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ride"

  /api/rides/{id}/accept:
    post:
      tags:
        - Rides - Driver
      summary: 🚗 Accept ride (driver only)
      description: |
        Driver accepts ride request
        - Changes ride status from PENDING to ACCEPTED
        - Links driver to the ride
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Ride ID
      responses:
        "200":
          description: Ride accepted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ride"

  /api/rides/{id}:
    patch:
      tags:
        - Rides - Driver
      summary: 🚗 Update ride status (driver only)
      description: |
        Driver updates ride status during execution
        - DRIVER_ARRIVED: Driver arrived at pickup point
        - IN_PROGRESS: Start ride
        - COMPLETED: Complete ride
        - CANCELLED: Cancel ride
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [DRIVER_ARRIVED, IN_PROGRESS, COMPLETED, CANCELLED]
                  example: IN_PROGRESS
                currentLat:
                  type: number
                  description: Driver's current location (optional)
                currentLng:
                  type: number
                  description: Driver's current location (optional)
      responses:
        "200":
          description: Ride status updated

    # ==================== Rides - Shared APIs ====================
    get:
      tags:
        - Rides - Shared
      summary: 📋 Ride details (shared)
      description: |
        Fetches details of a specific ride
        - Available for passenger and driver
        - Shows all ride details
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ride details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ride"

  /api/rides/{id}/cancel:
    post:
      tags:
        - Rides - Shared
      summary: ❌ Cancel ride (shared)
      description: |
        Cancel ride - available for passenger and driver
        - Passenger can cancel before driver accepts
        - Driver can cancel after acceptance with reason
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  example: "Emergency situation"
      responses:
        "200":
          description: Ride cancelled successfully

  # ==================== Rides - Negotiation ====================
  /api/rides/{id}/negotiate:
    post:
      tags:
        - Rides - Negotiation
      summary: 💰 Create/update negotiation offer
      description: |
        Passenger or driver submits price negotiation offer
        - Passenger can offer lower price
        - Driver can offer higher price
        - Each party can update their offer
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - offeredPrice
              properties:
                offeredPrice:
                  type: number
                  example: 25.50
                  description: Proposed price
                message:
                  type: string
                  example: "Can we lower the price a bit?"
                  description: Optional message to the other party
      responses:
        "200":
          description: Negotiation offer created/updated

    patch:
      tags:
        - Rides - Negotiation
      summary: 💰 Accept/reject negotiation
      description: |
        Other party accepts or rejects negotiation offer
        - If accepted: ride fare is updated
        - If rejected: original price remains
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  enum: [ACCEPT, REJECT]
                  example: ACCEPT
      responses:
        "200":
          description: Negotiation response recorded

  # ==================== Admin - Users ====================
  /api/admin/users:
    get:
      tags:
        - Admin - Users
      summary: Get users list
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: role
          schema:
            type: string
            enum: [CLIENT, DRIVER, ADMIN, SUPPORT]
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of users

    post:
      tags:
        - Admin - Users
      summary: Create new user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
                - name
                - role
              properties:
                phone:
                  type: string
                name:
                  type: string
                email:
                  type: string
                role:
                  type: string
                  enum: [CLIENT, SUPPORT]
      responses:
        "201":
          description: User created

  /api/admin/users/{id}:
    get:
      tags:
        - Admin - Users
      summary: User details
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User details

    patch:
      tags:
        - Admin - Users
      summary: Update user
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                role:
                  type: string
      responses:
        "200":
          description: User updated

    delete:
      tags:
        - Admin - Users
      summary: Delete user
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User deleted

  # ==================== Admin - Stats ====================
  /api/admin/stats:
    get:
      tags:
        - Admin - Stats
      summary: Get dashboard statistics
      description: |
        Fetches comprehensive dashboard statistics including:
        - Overview: Total users, drivers, rides, revenue
        - Recent activity: Last 7 days statistics
        - Top drivers by rating
        - Recent rides
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  overview:
                    type: object
                    properties:
                      totalUsers:
                        type: integer
                        example: 1500
                      totalDrivers:
                        type: integer
                        example: 250
                      totalRides:
                        type: integer
                        example: 5000
                      activeRides:
                        type: integer
                        example: 45
                        description: Rides with status REQUESTED, ACCEPTED, or IN_PROGRESS
                      completedRides:
                        type: integer
                        example: 4500
                      cancelledRides:
                        type: integer
                        example: 455
                      pendingDrivers:
                        type: integer
                        example: 12
                        description: Drivers waiting for approval
                      onlineDrivers:
                        type: integer
                        example: 85
                        description: Currently online approved drivers
                      totalRevenue:
                        type: number
                        example: 125000.50
                        description: Total revenue from completed rides
                  recent:
                    type: object
                    properties:
                      rides:
                        type: integer
                        example: 350
                        description: Rides in last 7 days
                      users:
                        type: integer
                        example: 75
                        description: New users in last 7 days
                      drivers:
                        type: integer
                        example: 15
                        description: New drivers in last 7 days
                  topDrivers:
                    type: array
                    description: Top 5 drivers by rating
                    items:
                      allOf:
                        - $ref: "#/components/schemas/Driver"
                        - type: object
                          properties:
                            user:
                              type: object
                              properties:
                                id:
                                  type: integer
                                name:
                                  type: string
                                phone:
                                  type: string
                                avatarUrl:
                                  type: string
                  recentRides:
                    type: array
                    description: Last 10 rides
                    items:
                      $ref: "#/components/schemas/Ride"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - Admin access only

  # ==================== Admin - Rides ====================
  /api/admin/rides:
    get:
      tags:
        - Admin - Rides
      summary: Get all rides (admin view)
      description: |
        Fetches all rides with pagination and filtering
        - Includes client and driver information
        - Supports filtering by status
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [REQUESTED, ACCEPTED, DRIVER_ARRIVED, IN_PROGRESS, COMPLETED, CANCELLED]
          description: Filter by ride status
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: List of rides with pagination
          content:
            application/json:
              schema:
                type: object
                properties:
                  rides:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/Ride"
                        - type: object
                          properties:
                            client:
                              type: object
                              properties:
                                id:
                                  type: integer
                                name:
                                  type: string
                                phone:
                                  type: string
                                avatarUrl:
                                  type: string
                            driver:
                              type: object
                              nullable: true
                              properties:
                                id:
                                  type: integer
                                user:
                                  type: object
                                  properties:
                                    id:
                                      type: integer
                                    name:
                                      type: string
                                    phone:
                                      type: string
                                    avatarUrl:
                                      type: string
                  pagination:
                    type: object
                    properties:
                      total:
                        type: integer
                        example: 5000
                      page:
                        type: integer
                        example: 1
                      limit:
                        type: integer
                        example: 20
                      pages:
                        type: integer
                        example: 250
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - Admin access only

  /api/admin/rides/create:
    post:
      tags:
        - Admin - Rides
      summary: Create ride (admin)
      description: |
        Admin creates a ride on behalf of a client
        - Can optionally assign a driver immediately
        - Calculates distance and fare automatically
        - Sends notifications to client and driver
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - clientId
                - pickupLat
                - pickupLng
                - dropoffLat
                - dropoffLng
              properties:
                clientId:
                  type: integer
                  example: 10
                  description: Client user ID
                driverId:
                  type: integer
                  nullable: true
                  example: 5
                  description: Optional driver ID to assign immediately
                pickupLat:
                  type: number
                  example: 24.7136
                pickupLng:
                  type: number
                  example: 46.6753
                pickupAddress:
                  type: string
                  example: "King Fahd Road, Riyadh"
                dropoffLat:
                  type: number
                  example: 24.7736
                dropoffLng:
                  type: number
                  example: 46.7353
                dropoffAddress:
                  type: string
                  example: "King Khalid International Airport"
                type:
                  type: string
                  enum: [STANDARD, CARPOOLING]
                  default: STANDARD
                notes:
                  type: string
                  description: Optional admin notes
      responses:
        "201":
          description: Ride created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  ride:
                    $ref: "#/components/schemas/Ride"
                  message:
                    type: string
                    example: "Ride created successfully"
        "400":
          description: Bad request - Invalid data or driver not approved
        "404":
          description: Client or driver not found
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - Admin access only

  /api/admin/rides/{id}:
    get:
      tags:
        - Admin - Rides
      summary: Get ride details (admin)
      description: |
        Fetches complete ride details including:
        - Client and driver information
        - Negotiation history
        - Passengers (for carpooling)
        - Payment information
        - Review
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Ride ID
      responses:
        "200":
          description: Complete ride details
          content:
            application/json:
              schema:
                type: object
                properties:
                  ride:
                    allOf:
                      - $ref: "#/components/schemas/Ride"
                      - type: object
                        properties:
                          client:
                            type: object
                            properties:
                              id:
                                type: integer
                              name:
                                type: string
                              phone:
                                type: string
                              email:
                                type: string
                              avatarUrl:
                                type: string
                          driver:
                            type: object
                            nullable: true
                            properties:
                              id:
                                type: integer
                              user:
                                type: object
                          negotiation:
                            $ref: "#/components/schemas/Negotiation"
                          passengers:
                            type: array
                            items:
                              type: object
                          payment:
                            $ref: "#/components/schemas/Payment"
                          review:
                            $ref: "#/components/schemas/Review"
        "404":
          description: Ride not found
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - Admin access only

    delete:
      tags:
        - Admin - Rides
      summary: Delete ride (admin)
      description: |
        Admin deletes a ride
        - Use with caution - this is permanent
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ride deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        "404":
          description: Ride not found
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - Admin access only

  # ==================== Admin - Drivers ====================
  /api/admin/drivers:
    get:
      tags:
        - Admin - Drivers
      summary: Get drivers list
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: isApproved
          schema:
            type: boolean
          description: Filter by approval status
        - in: query
          name: isOnline
          schema:
            type: boolean
          description: Filter by online status
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of drivers

    post:
      tags:
        - Admin - Drivers
      summary: Create new driver
      description: |
        Admin creates new driver account
        - Creates User with role=DRIVER
        - Creates Driver profile linked to User
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - name
                - licenseNumber
                - carModel
                - carPlate
              properties:
                email:
                  type: string
                  format: email
                  example: "driver@example.com"
                name:
                  type: string
                  example: "Mohammed Ahmed"
                phone:
                  type: string
                  example: "+966501234567"
                licenseNumber:
                  type: string
                  example: "123456789"
                carModel:
                  type: string
                  example: "Toyota Camry 2022"
                carPlate:
                  type: string
                  example: "ABC-1234"
                carColor:
                  type: string
                  example: "White"
                carYear:
                  type: integer
                  example: 2022
                isApproved:
                  type: boolean
                  default: false
                  description: Approve driver immediately
      responses:
        "201":
          description: Driver created

  /api/admin/drivers/{id}:
    get:
      tags:
        - Admin - Drivers
      summary: Driver details
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Driver details

    patch:
      tags:
        - Admin - Drivers
      summary: Update driver and approve
      description: |
        Update driver information
        - Can update car information
        - Can approve driver (isApproved)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                licenseNumber:
                  type: string
                carModel:
                  type: string
                carPlate:
                  type: string
                carColor:
                  type: string
                carYear:
                  type: integer
                isApproved:
                  type: boolean
                  description: Approve or revoke driver approval
      responses:
        "200":
          description: Driver updated

    delete:
      tags:
        - Admin - Drivers
      summary: Delete driver
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Driver deleted
