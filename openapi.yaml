openapi: 3.0.2
paths:
  /api/auth/send-otp:
    post:
      description: |-
        Send OTP verification code via email using Resend service
        - For new users (client): Account is created automatically upon verification
        - For drivers: Account must exist and be approved by admin beforehand
        - Rate Limiting: 3 attempts every 10 minutes
        - OTP validity: 5 minutes
      summary: Send OTP to email
      tags:
        - Auth
      parameters: []
      operationId: sendOtp
      requestBody:
        description: Body
        content:
          application/json:
            schema: {}
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema: {}
        "400":
          description: "400"
          content:
            application/json:
              schema: {}
        "403":
          description: "403"
          content:
            application/json:
              schema: {}
        "404":
          description: "404"
          content:
            application/json:
              schema: {}
        "429":
          description: "429"
          content:
            application/json:
              schema: {}
  /api/auth/verify-otp:
    post:
      description: |-
        Verify OTP code and get JWT token
        - For new users (client): Account is created automatically
        - For drivers: Account must exist
        - JWT valid for 7 days
        - Token returned in response and Cookie
      summary: Verify OTP and get JWT
      tags:
        - Auth
      parameters: []
      operationId: verifyOtp
      requestBody:
        description: Body
        content:
          application/json:
            schema: {}
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema: {}
        "400":
          description: "400"
          content:
            application/json:
              schema: {}
        "403":
          description: "403"
          content:
            application/json:
              schema: {}
