        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of users

    post:
      tags:
        - Admin - Users
      summary: إنشاء مستخدم جديد
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
                - name
                - role
              properties:
                phone:
                  type: string
                name:
                  type: string
                email:
                  type: string
                role:
                  type: string
                  enum: [CLIENT, SUPPORT]
      responses:
        "201":
          description: User created

  /api/admin/users/{id}:
    get:
      tags:
        - Admin - Users
      summary: تفاصيل مستخدم
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User details

    patch:
      tags:
        - Admin - Users
      summary: تعديل مستخدم
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                role:
                  type: string
      responses:
        "200":
          description: User updated

    delete:
      tags:
        - Admin - Users
      summary: حذف مستخدم
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User deleted

  # ==================== Admin - Drivers ====================
  /api/admin/drivers:
    get:
      tags:
        - Admin - Drivers
      summary: جلب قائمة السائقين
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: isApproved
          schema:
            type: boolean
          description: تصفية حسب حالة الموافقة
        - in: query
          name: isOnline
          schema:
            type: boolean
          description: تصفية حسب حالة الاتصال
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of drivers

    post:
      tags:
        - Admin - Drivers
      summary: إنشاء سائق جديد
      description: |
        الأدمن ينشئ حساب سائق جديد
        - يتم إنشاء User بـ role=DRIVER
        - يتم إنشاء Driver profile مرتبط بالـ User
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - name
                - licenseNumber
                - carModel
                - carPlate
              properties:
                email:
                  type: string
                  format: email
                  example: "driver@example.com"
                name:
                  type: string
                  example: "محمد أحمد"
                phone:
                  type: string
                  example: "+966501234567"
                licenseNumber:
                  type: string
                  example: "123456789"
                carModel:
                  type: string
                  example: "Toyota Camry 2022"
                carPlate:
                  type: string
                  example: "ABC-1234"
                carColor:
                  type: string
                  example: "أبيض"
                carYear:
                  type: integer
                  example: 2022
                isApproved:
                  type: boolean
                  default: false
                  description: الموافقة على السائق مباشرة
      responses:
        "201":
          description: Driver created

  /api/admin/drivers/{id}:
    get:
      tags:
        - Admin - Drivers
      summary: تفاصيل سائق
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Driver details

    patch:
      tags:
        - Admin - Drivers
      summary: تعديل سائق والموافقة عليه
      description: |
        تعديل بيانات السائق
        - يمكن تحديث بيانات السيارة
        - يمكن الموافقة على السائق (isApproved)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                licenseNumber:
                  type: string
                carModel:
                  type: string
                carPlate:
                  type: string
                carColor:
                  type: string
                carYear:
                  type: integer
                isApproved:
                  type: boolean
                  description: الموافقة على السائق أو إلغاء الموافقة
      responses:
        "200":
          description: Driver updated

    delete:
      tags:
        - Admin - Drivers
      summary: حذف سائق
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Driver deleted
