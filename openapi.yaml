openapi: 3.0.0
info:
  title: Ride Sharing API
  version: 1.0.0
  description: |
    API documentation for the ride sharing platform

    ## التصنيفات:
    - 🧑 **Rides - Passenger**: APIs خاصة بالركاب (طلب رحلة، عرض رحلاتي)
    - 🚗 **Rides - Driver**: APIs خاصة بالسائقين (رحلات قريبة، قبول رحلة، تحديث حالة)
    - 💰 **Rides - Negotiation**: APIs التفاوض على السعر (مشتركة)
    - 📋 **Rides - Shared**: APIs مشتركة بين الراكب والسائق

servers:
  - url: http://localhost:3000
    description: Local development server
  - url: https://your-production-url.com
    description: Production server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        phone:
          type: string
          nullable: true
          example: "+966501234567"
        email:
          type: string
          nullable: true
          format: email
          example: "user@example.com"
        name:
          type: string
          nullable: true
          example: "أحمد محمد"
        avatarUrl:
          type: string
          nullable: true
          example: "https://example.com/avatar.jpg"
        role:
          type: string
          enum: [CLIENT, DRIVER, ADMIN, CUSTOMER_SUPPORT]
          example: "CLIENT"
        isVerified:
          type: boolean
          example: true
          description: هل تم التحقق من المستخدم
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Driver:
      type: object
      properties:
        id:
          type: integer
          example: 1
        userId:
          type: integer
          example: 5
        licenseNumber:
          type: string
          example: "123456789"
        carModel:
          type: string
          example: "Toyota Camry 2022"
        carPlate:
          type: string
          example: "ABC-1234"
        carColor:
          type: string
          nullable: true
          example: "أبيض"
        carYear:
          type: integer
          nullable: true
          example: 2022
        isApproved:
          type: boolean
          example: true
          description: هل تمت الموافقة على السائق من الأدمن
        isOnline:
          type: boolean
          example: false
          description: هل السائق متصل حالياً
        latitude:
          type: number
          nullable: true
          example: 24.7136
          description: الموقع الحالي - خط العرض
        longitude:
          type: number
          nullable: true
          example: 46.6753
          description: الموقع الحالي - خط الطول
        rating:
          type: number
          example: 4.5
          description: التقييم العام
        totalRides:
          type: integer
          example: 150
          description: عدد الرحلات المكتملة
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Ride:
      type: object
      properties:
        id:
          type: integer
          example: 1
        clientId:
          type: integer
          example: 10
        driverId:
          type: integer
          nullable: true
          example: 5
        status:
          type: string
          enum: [REQUESTED, ACCEPTED, DRIVER_ARRIVED, IN_PROGRESS, COMPLETED, CANCELLED]
          example: "REQUESTED"
        type:
          type: string
          enum: [STANDARD, CARPOOLING]
          example: "STANDARD"
          description: |
            نوع الرحلة:
            - STANDARD: رحلة عادية 1-1
            - CARPOOLING: مشاركة الركوب
        maxPassengers:
          type: integer
          example: 1
          description: الحد الأقصى للركاب (1 للعادية، 2-4 للمشاركة)
        availableSeats:
          type: integer
          example: 1
          description: المقاعد المتاحة
        systemFare:
          type: number
          nullable: true
          example: 35.50
          description: السعر الذي حسبه النظام
        pickupLat:
          type: number
          example: 24.7136
        pickupLng:
          type: number
          example: 46.6753
        pickupAddress:
          type: string
          nullable: true
          example: "شارع الملك فهد، الرياض"
        dropoffLat:
          type: number
          example: 24.7736
        dropoffLng:
          type: number
          example: 46.7353
        dropoffAddress:
          type: string
          nullable: true
          example: "مطار الملك خالد الدولي"
        fare:
          type: number
          nullable: true
          example: 30.00
          description: السعر النهائي (بعد التفاوض إن وجد)
        distance:
          type: number
          nullable: true
          example: 15.5
          description: المسافة بالكيلومتر
        duration:
          type: integer
          nullable: true
          example: 1200
          description: المدة بالثواني
        requestedAt:
          type: string
          format: date-time
        acceptedAt:
          type: string
          format: date-time
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        cancelReason:
          type: string
          nullable: true
          example: "ظرف طارئ"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Negotiation:
      type: object
      properties:
        id:
          type: integer
          example: 1
        rideId:
          type: integer
          example: 10
        systemFare:
          type: number
          example: 35.50
          description: السعر الأصلي من النظام
        clientOffer:
          type: number
          example: 30.00
          description: عرض الزبون
        driverCounter:
          type: number
          nullable: true
          example: 32.50
          description: رد السائق (اختياري)
        agreedFare:
          type: number
          nullable: true
          example: 32.50
          description: السعر النهائي المتفق عليه
        status:
          type: string
          enum: [PENDING, COUNTERED, ACCEPTED, REJECTED, EXPIRED]
          example: "PENDING"
          description: |
            حالة التفاوض:
            - PENDING: الزبون بعث عرض، ما في رد
            - COUNTERED: السائق رد بعرض ثاني
            - ACCEPTED: تم الاتفاق
            - REJECTED: رُفض التفاوض
            - EXPIRED: انتهت المهلة
        expiresAt:
          type: string
          format: date-time
          description: مهلة الرد (مثلاً 2 دقيقة)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Payment:
      type: object
      properties:
        id:
          type: integer
          example: 1
        rideId:
          type: integer
          example: 10
        amount:
          type: number
          example: 32.50
        method:
          type: string
          enum: [CASH, CARD, WALLET]
          example: "CASH"
        status:
          type: string
          enum: [PENDING, PAID, FAILED, REFUNDED]
          example: "PENDING"
        transactionId:
          type: string
          nullable: true
          example: "txn_123456789"
        passengerId:
          type: integer
          nullable: true
          description: للـ carpooling — دفع راكب معين (اختياري)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Review:
      type: object
      properties:
        id:
          type: integer
          example: 1
        rideId:
          type: integer
          example: 10
        clientId:
          type: integer
          example: 15
        driverId:
          type: integer
          example: 5
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comment:
          type: string
          nullable: true
          example: "سائق ممتاز وسيارة نظيفة"
        createdAt:
          type: string
          format: date-time

paths:
  # ==================== Authentication ====================
  /api/auth/send-otp:
    post:
      tags:
        - Authentication
      summary: إرسال OTP للبريد الإلكتروني
      description: |
        إرسال رمز التحقق OTP عبر البريد الإلكتروني باستخدام خدمة Resend
        - للمستخدمين الجدد (client): يتم إنشاء حساب تلقائياً عند التحقق
        - للسائقين (driver): يجب أن يكون الحساب موجوداً ومعتمداً مسبقاً من الأدمن
        - Rate Limiting: 3 محاولات كل 10 دقائق
        - صلاحية OTP: 5 دقائق
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - appContext
              properties:
                email:
                  type: string
                  format: email
                  example: "user@example.com"
                  description: البريد الإلكتروني للمستخدم
                appContext:
                  type: string
                  enum: [client, driver]
                  example: "client"
                  description: |
                    نوع المستخدم:
                    - client: مستخدم عادي (يتم إنشاء حساب تلقائياً)
                    - driver: سائق (يجب أن يكون موجوداً ومعتمداً)
      responses:
        "200":
          description: OTP sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  expiresInSeconds:
                    type: integer
                    example: 300
                    description: مدة صلاحية OTP بالثواني
        "400":
          description: Invalid email or context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Driver account pending approval
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Driver account pending approval"
        "404":
          description: No driver account found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "No driver account found"
        "429":
          description: Too many requests (rate limited)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Too many requests"
                  retryAfterSeconds:
                    type: integer
                    example: 600
                    description: عدد الثواني قبل المحاولة مرة أخرى

  /api/auth/verify-otp:
    post:
      tags:
        - Authentication
      summary: التحقق من OTP والحصول على JWT
      description: |
        التحقق من رمز OTP والحصول على JWT token
        - للمستخدمين الجدد (client): يتم إنشاء حساب تلقائياً
        - للسائقين (driver): يجب أن يكون الحساب موجوداً
        - JWT صالح لمدة 7 أيام
        - يتم إرجاع token في الاستجابة وفي Cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - code
                - appContext
              properties:
                email:
                  type: string
                  format: email
                  example: "user@example.com"
                  description: البريد الإلكتروني
                code:
                  type: string
                  example: "123456"
                  description: رمز التحقق المكون من 6 أرقام
                appContext:
                  type: string
                  enum: [client, driver]
                  example: "client"
                  description: نوع المستخدم
      responses:
        "200":
          description: Verification successful
          headers:
            Set-Cookie:
              description: JWT token in HttpOnly cookie
              schema:
                type: string
                example: "token=eyJhbGc...; HttpOnly; Path=/; Max-Age=604800; SameSite=Strict"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  token:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                    description: JWT token صالح لمدة 7 أيام
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      email:
                        type: string
                        example: "user@example.com"
                      role:
                        type: string
                        enum: [CLIENT, DRIVER, ADMIN, CUSTOMER_SUPPORT]
                        example: "CLIENT"
                      isVerified:
                        type: boolean
                        example: true
        "400":
          description: Invalid or expired OTP
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid or expired OTP"
        "403":
          description: Account type mismatch
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "This account is not a driver account."

  /api/auth/admin-login:
    post:
      tags:
        - Authentication
      summary: تسجيل دخول الأدمن
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  example: "admin@example.com"
                password:
                  type: string
                  example: "password123"
      responses:
        "200":
          description: Login successful

  # ==================== Profile ====================
  /api/profile:
    get:
      tags:
        - Profile
      summary: جلب بيانات المستخدم الحالي
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

    patch:
      tags:
        - Profile
      summary: تعديل بيانات المستخدم
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
      responses:
        "200":
          description: Profile updated

  /api/profile/driver:
    get:
      tags:
        - Profile
      summary: جلب بيانات السائق الكاملة
      description: |
        يجلب بيانات السائق الكاملة للمستخدم الحالي
        - يجب أن يكون المستخدم سائقاً (role=DRIVER)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Driver profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Driver"

    patch:
      tags:
        - Profile
      summary: تعديل بيانات السائق
      description: |
        السائق يعدل بياناته الشخصية
        - لا يمكن تعديل isApproved (الأدمن فقط)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                licenseNumber:
                  type: string
                carModel:
                  type: string
                carPlate:
                  type: string
                carColor:
                  type: string
                carYear:
                  type: integer
                isOnline:
                  type: boolean
                  description: تحديث حالة الاتصال
                latitude:
                  type: number
                  description: تحديث الموقع الحالي
                longitude:
                  type: number
                  description: تحديث الموقع الحالي
      responses:
        "200":
          description: Driver profile updated

  # ==================== Rides - Passenger APIs ====================
  /api/rides:
    get:
      tags:
        - Rides - Passenger
      summary: 🧑 جلب رحلات الراكب
      description: |
        يجلب رحلات المستخدم الحالي كراكب (الرحلات اللي طلبها)
        - يستخدمه الراكب لعرض رحلاته
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [PENDING, ACCEPTED, IN_PROGRESS, COMPLETED, CANCELLED]
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of rides
          content:
            application/json:
              schema:
                type: object
                properties:
                  rides:
                    type: array
                    items:
                      $ref: "#/components/schemas/Ride"
                  total:
                    type: integer

    post:
      tags:
        - Rides - Passenger
      summary: 🧑 إنشاء رحلة جديدة (طلب رحلة)
      description: |
        الراكب ينشئ طلب رحلة جديدة
        - يحدد نقطة الانطلاق والوجهة
        - يختار نوع الرحلة (STANDARD أو CARPOOLING)
        - النظام يحسب السعر تلقائياً (systemFare)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pickupLat
                - pickupLng
                - dropoffLat
                - dropoffLng
              properties:
                pickupLat:
                  type: number
                  example: 24.7136
                  description: خط العرض لنقطة الانطلاق
                pickupLng:
                  type: number
                  example: 46.6753
                  description: خط الطول لنقطة الانطلاق
                pickupAddress:
                  type: string
                  example: "شارع الملك فهد، الرياض"
                dropoffLat:
                  type: number
                  example: 24.7736
                  description: خط العرض للوجهة
                dropoffLng:
                  type: number
                  example: 46.7353
                  description: خط الطول للوجهة
                dropoffAddress:
                  type: string
                  example: "مطار الملك خالد الدولي"
                type:
                  type: string
                  enum: [STANDARD, CARPOOLING]
                  default: STANDARD
                  description: نوع الرحلة
                maxPassengers:
                  type: integer
                  minimum: 1
                  maximum: 4
                  default: 1
                  description: الحد الأقصى للركاب (للـ CARPOOLING فقط)
      responses:
        "201":
          description: Ride created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ride"

  # ==================== Rides - Driver APIs ====================
  /api/rides/nearby:
    get:
      tags:
        - Rides - Driver
      summary: 🚗 أقرب الرحلات المتاحة (للسائق)
      description: |
        السائق يشوف الرحلات القريبة منه والمتاحة للقبول
        - يعرض فقط الرحلات بحالة PENDING
        - يحسب المسافة من موقع السائق الحالي
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: lat
          required: true
          schema:
            type: number
          description: موقع السائق الحالي - خط العرض
          example: 24.7136
        - in: query
          name: lng
          required: true
          schema:
            type: number
          description: موقع السائق الحالي - خط الطول
          example: 46.6753
        - in: query
          name: radius
          schema:
            type: number
            default: 10
          description: نطاق البحث بالكيلومتر
      responses:
        "200":
          description: Nearby available rides
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ride"

  /api/rides/{id}/accept:
    post:
      tags:
        - Rides - Driver
      summary: 🚗 قبول الرحلة (السائق فقط)
      description: |
        السائق يقبل طلب الرحلة
        - يغير حالة الرحلة من PENDING إلى ACCEPTED
        - يربط السائق بالرحلة
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: معرف الرحلة
      responses:
        "200":
          description: Ride accepted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ride"

  /api/rides/{id}:
    patch:
      tags:
        - Rides - Driver
      summary: 🚗 تحديث حالة الرحلة (السائق فقط)
      description: |
        السائق يحدث حالة الرحلة أثناء تنفيذها
        - DRIVER_ARRIVED: السائق وصل لنقطة الانطلاق
        - IN_PROGRESS: بدء الرحلة
        - COMPLETED: إنهاء الرحلة
        - CANCELLED: إلغاء الرحلة
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [DRIVER_ARRIVED, IN_PROGRESS, COMPLETED, CANCELLED]
                  example: IN_PROGRESS
                currentLat:
                  type: number
                  description: الموقع الحالي للسائق (اختياري)
                currentLng:
                  type: number
                  description: الموقع الحالي للسائق (اختياري)
      responses:
        "200":
          description: Ride status updated

    # ==================== Rides - Shared APIs ====================
    get:
      tags:
        - Rides - Shared
      summary: 📋 تفاصيل رحلة (مشترك)
      description: |
        يجلب تفاصيل رحلة معينة
        - متاح للراكب والسائق
        - يعرض كل تفاصيل الرحلة
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ride details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ride"

  /api/rides/{id}/cancel:
    post:
      tags:
        - Rides - Shared
      summary: ❌ إلغاء الرحلة (مشترك)
      description: |
        إلغاء الرحلة - متاح للراكب والسائق
        - الراكب يقدر يلغي قبل ما السائق يقبل
        - السائق يقدر يلغي بعد القبول مع ذكر السبب
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  example: "ظرف طارئ"
      responses:
        "200":
          description: Ride cancelled successfully

  # ==================== Rides - Negotiation ====================
  /api/rides/{id}/negotiate:
    post:
      tags:
        - Rides - Negotiation
      summary: 💰 إنشاء/تحديث عرض تفاوض
      description: |
        الراكب أو السائق يقدم عرض سعر للتفاوض
        - الراكب يقدر يعرض سعر أقل
        - السائق يقدر يعرض سعر أعلى
        - كل طرف يقدر يحدث عرضه
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - offeredPrice
              properties:
                offeredPrice:
                  type: number
                  example: 25.50
                  description: السعر المقترح
                message:
                  type: string
                  example: "هل ممكن نخفض السعر شوي؟"
                  description: رسالة اختيارية للطرف الآخر
      responses:
        "200":
          description: Negotiation offer created/updated

    patch:
      tags:
        - Rides - Negotiation
      summary: 💰 قبول/رفض التفاوض
      description: |
        الطرف الآخر يقبل أو يرفض عرض التفاوض
        - إذا قبل: يتحدث سعر الرحلة
        - إذا رفض: يبقى السعر الأصلي
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  enum: [ACCEPT, REJECT]
                  example: ACCEPT
      responses:
        "200":
          description: Negotiation response recorded

